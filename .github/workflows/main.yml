name: Extrair Métricas do Instagram

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 🔥 ESSA LINHA RESOLVE O 403
permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  extract_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4
      with:
        persist-credentials: true  # garante uso do token

    - name: Configurar R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'
        use-public-rspm: true

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev

    - name: Instalar Pacotes R
      run: |
        install.packages(c('httr', 'jsonlite', 'dplyr'), repos='https://cloud.r-project.org')
      shell: Rscript {0}

    - name: Executar Script R
      env:
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      run: Rscript extract_instagram_metrics.R

    - name: Commit e Push do CSV
      run: |
        if [ -f instagram_metrics.csv ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add instagram_metrics.csv
          git commit -m "Atualizar métricas do Instagram - $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || echo "Nada para commitar"

          git push
          echo "✓ CSV atualizado com sucesso!"
        else
          echo "✗ CSV não foi gerado"
          exit 1
        fi
