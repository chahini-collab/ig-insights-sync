name: Extrair Métricas do Instagram

on:
  schedule:
    - cron: '0 0 * * *'  # Meia-noite UTC diariamente
  workflow_dispatch:     # Permite execução manual

jobs:
  extract_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.x'
      
      - name: Instalar Dependências
        run: install.packages(c("httr", "jsonlite", "dplyr"))
        shell: Rscript {0}
      
      - name: Executar Script
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: Rscript extract_instagram_metrics.R
      
      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_metrics.csv
          git commit -m "Atualizar métricas [skip ci]"
          git push
